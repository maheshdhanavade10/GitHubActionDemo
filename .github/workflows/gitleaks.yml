name: Gitleaks Secret Scan

on:
  workflow_call:
  workflow_dispatch:

jobs:
  scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Required to upload results to the Security tab
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Run Gitleaks with custom config
        uses: gitleaks/gitleaks-action@v2
        with:
          entrypoint: /gitleaks/gitleaks
          args: >
            detect
            --config=.gitleaks.toml
            --report-format=sarif
            --report-path=results.sarif
            --redact
            --exit-code=0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true  # Optional: prevents job failure on leaks

      - name: Upload Gitleaks SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
