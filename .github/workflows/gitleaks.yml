name: Gitleaks Secret Scan

on:
  workflow_call:
  workflow_dispatch:

jobs:
  scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Required to upload results to the Security tab
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        with: 
          args: detect --config=.gitleaks.toml --report-format=sarif --report-path=results.sarif
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Gitleaks-action v2 creates a file named 'results.sarif' by default

      - name: Upload Gitleaks SARIF report
        # Only upload if the Gitleaks step actually ran
        if: always() 
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
