name: Trivy Dependency Scan

on:
  workflow_call:
  workflow_dispatch:
  

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # STEP 1: Setup .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # STEP 2: Restore dependencies 
      # This generates the 'obj/project.assets.json' file which Trivy actually scans.
      - name: Restore dependencies
        run: dotnet restore

      # STEP 3: Run Trivy scan
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          # We remove ignore-unfixed to ensure we see the vulnerable Newtonsoft.Json
          # even if a direct "fix" isn't applied to the current OS layer.
          ignore-unfixed: false 
          format: 'sarif'
          output: 'trivy-results.sarif'
          # CRITICAL/HIGH filter - Vulnerable Newtonsoft.Json versions often fall here.
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # STEP 4: Upload to Security Tab
      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'
