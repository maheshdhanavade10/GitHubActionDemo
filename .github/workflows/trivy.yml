name: Trivy Dependency Scan

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # STEP 1: Setup .NET SDK (Required for restore)
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Match your project version (e.g., 6.0.x, 8.0.x)

      # STEP 2: Restore dependencies 
      # This creates the 'project.assets.json' files Trivy needs to see vulnerabilities
      - name: Restore dependencies
        run: dotnet restore

      # STEP 3: Run Trivy scan
      - name: Run Trivy vulnerability scanner (Repo scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          # Exit 0 ensures the pipeline doesn't break, but results still upload
          exit-code: '0' 

      # STEP 4: Upload to Security Tab
      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'
