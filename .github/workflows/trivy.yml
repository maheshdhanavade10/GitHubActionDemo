name: Trivy Dependency Scan

on:
  workflow_call:
  workflow_dispatch:
  

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        # Force a fresh restore to ensure obj/project.assets.json exists
        run: dotnet restore

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0 # Use a fixed version for stability
        with:
          scan-type: 'fs'
          scan-ref: '.'
          # FIX: Explicitly include the 'obj' folder even if it's ignored by git
          # If Trivy still misses it, we can point directly to the file
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        env:
          # This environment variable tells Trivy to look for .NET assets files
          TRIVY_DETECTORS: "nuget" 

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'
