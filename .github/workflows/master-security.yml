name: "Master Security Pipeline"

on:
  workflow_dispatch:

# Permissions remain at the top level to be inherited
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  call-gitleaks:
    uses: ./.github/workflows/gitleaks.yml
    secrets: inherit

  call-trivy:
    # Removed 'needs: call-gitleaks' to allow parallel run
    uses: ./.github/workflows/trivy.yml
    secrets: inherit

  call-codeql:
    # Removed 'needs: call-trivy' to allow parallel run
    uses: ./.github/workflows/codeql.yml
    secrets: inherit
