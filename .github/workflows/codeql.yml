name: "CodeQL Analysis"

on:
  push:
    branches: ["main", "dev"]   # run on both main and dev
  pull_request:
    branches: ["main", "dev"]   # analyze PRs targeting main or dev
  schedule:
    - cron: '0 0 * * 0'         # optional weekly scan (Sunday midnight)

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual   # manual build for .NET projects

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: +security-extended,security-and-quality

      # 👇 Manual build steps for C#
      - name: Restore dependencies
        run: dotnet restore ./YourSolution.sln

      - name: Build solution
        run: dotnet build ./YourSolution.sln --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
