name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # Optional: Add queries for a deeper Web API scan
        queries: security-extended,security-and-quality

    - name: Clean solution
      run: dotnet clean

    - name: Restore dependencies
      run: dotnet restore

    # The fix for Exit Code 32:
    # 1. -p:UseSharedCompilation=false prevents the background VBCSCompiler
    # 2. -p:BuildInParallel=false ensures sequential tracking
    # 3. --no-incremental forces a fresh build for CodeQL to index
    - name: Build solution
      run: |
        dotnet build --configuration Release \
        -p:UseSharedCompilation=false \
        -p:BuildInParallel=false \
        --no-incremental \
        --no-restore

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
