name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality
        # This ensures we only scan your API logic and ignore Test noise
        config: |
          paths-ignore:
            - 'GitHubActionDemo.Tests/**'

    - name: Restore dependencies
      run: dotnet restore GitHubActionDemo.API/GitHubActionDemo.API.csproj

    - name: Build API Project
      # --no-incremental and -p:UseSharedCompilation=false are 
      # critical to ensure a "fresh" scan every time.
      run: |
        dotnet build GitHubActionDemo.API/GitHubActionDemo.API.csproj \
        --configuration Release \
        --no-restore \
        --no-incremental \
        -p:UseSharedCompilation=false \
        -p:BuildInParallel=false

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        # The category helps GitHub track the "history" of alerts for this specific project
        category: "/language:${{matrix.language}}"
