name: "CodeQL"

on:
  workflow_call: 
  workflow_dispatch: 

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality
        config: |
          paths-ignore:
            - 'GitHubActionDemo.Tests/**'

    - name: Restore dependencies
      # continue-on-error ensures that if a package source is down, 
      # the master pipeline doesn't turn red.
      continue-on-error: true
      run: dotnet restore GitHubActionDemo.API/GitHubActionDemo.API.csproj

    - name: Build API Project
      # If the code has a syntax error and fails to build, 
      # CodeQL cannot analyze it, but we don't want to block the pipeline.
      continue-on-error: true
      run: |
        dotnet build GitHubActionDemo.API/GitHubActionDemo.API.csproj \
        --configuration Release \
        --no-restore \
        --no-incremental \
        -p:UseSharedCompilation=false \
        -p:BuildInParallel=false

    - name: Perform CodeQL Analysis
      # This performs the actual scan and uploads the results.
      continue-on-error: true
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
