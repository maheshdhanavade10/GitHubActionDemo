title = "Gitleaks Ruleset with Empty Structure Suppression"

[allowlist]
description = "Suppress false positives for empty or placeholder values"
regexes = [
  '''(?i)(Server\s*=\s*["']?["']?;\s*User\s*Id\s*=\s*["']?["']?;\s*Password\s*=\s*["']?["']?;)''',
  '''(?i)(password\s*=\s*["']{0,1}["']{0,1})''',
  '''(?i)(secret\s*=\s*["']{0,1}["']{0,1})''',
  '''(?i)(connectionstring\s*=\s*["']{0,1}["']{0,1})'''
]

# =========================
# Real Secret Detection
# =========================

[[rules]]
id = "connection-string"
description = "Detect DB connection strings with credentials"
regex = '''(?i)(Server\s*=\s*[^;]+;\s*User\s*Id\s*=\s*[^;]+;\s*Password\s*=\s*[^;]+;)'''
tags = ["connectionstring", "database", "secret"]

[[rules]]
id = "generic-password"
description = "Detect hardcoded passwords"
regex = '''(?i)(password\s*=\s*["'][^"']{6,}["'])'''
tags = ["password", "secret"]

[[rules]]
id = "generic-secret"
description = "Detect generic secret assignments"
regex = '''(?i)(secret\s*=\s*["'][^"']{6,}["'])'''
tags = ["secret", "generic"]

[[rules]]
id = "aws-access-key"
description = "Detect AWS Access Key IDs"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["aws", "key", "secret"]

[[rules]]
id = "aws-secret-key"
description = "Detect AWS Secret Access Keys"
regex = '''(?i)aws(.{0,20})?(secret|access)?.{0,20}?['"][0-9a-zA-Z/+]{40}['"]'''
tags = ["aws", "secret"]

[[rules]]
id = "jwt-token"
description = "Detect JWT tokens"
regex = '''eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.([A-Za-z0-9_-]+)'''
tags = ["jwt", "token"]

[[rules]]
id = "private-key"
description = "Detect private key blocks"
regex = '''-----BEGIN( RSA)? PRIVATE KEY-----'''
tags = ["privatekey", "secret"]

[[rules]]
id = "github-token"
description = "Detect GitHub tokens"
regex = '''ghp_[0-9A-Za-z]{36}'''
tags = ["github", "token"]
