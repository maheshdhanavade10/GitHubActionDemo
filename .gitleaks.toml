title = "Generic Gitleaks Ruleset"

# Global settings
[allowlist]
description = "Allowlist for false positives"
regexes = [
  '''(?i)examplepassword''',
  '''(?i)dummyapikey'''
]
paths = [
  '''tests/''',
  '''docs/'''
]

# =========================
# Common Secret Patterns
# =========================

[[rules]]
id = "generic-password"
description = "Detect hardcoded passwords"
regex = '''(?i)(password\s*=\s*["'][^"']+["'])'''
tags = ["password", "secret"]

[[rules]]
id = "connection-string"
description = "Detect DB connection strings"
regex = '''(?i)(Server=.*;User\s*Id=.*;Password=.*;)'''
tags = ["connectionstring", "database", "secret"]

[[rules]]
id = "aws-access-key"
description = "Detect AWS Access Key IDs"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["aws", "key", "secret"]

[[rules]]
id = "aws-secret-key"
description = "Detect AWS Secret Access Keys"
regex = '''(?i)aws(.{0,20})?(secret|access)?.{0,20}?['"][0-9a-zA-Z/+]{40}['"]'''
tags = ["aws", "secret"]

[[rules]]
id = "jwt-token"
description = "Detect JWT tokens"
regex = '''eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.([A-Za-z0-9_-]+)'''
tags = ["jwt", "token"]

[[rules]]
id = "generic-api-key"
description = "Detect generic API keys"
regex = '''(?i)(api[_-]?key\s*=\s*["'][0-9a-zA-Z-_]{16,}["'])'''
tags = ["apikey", "secret"]

[[rules]]
id = "private-key"
description = "Detect private key blocks"
regex = '''-----BEGIN( RSA)? PRIVATE KEY-----'''
tags = ["privatekey", "secret"]

[[rules]]
id = "github-token"
description = "Detect GitHub tokens"
regex = '''ghp_[0-9A-Za-z]{36}'''
tags = ["github", "token"]

[[rules]]
id = "slack-token"
description = "Detect Slack tokens"
regex = '''xox[baprs]-[0-9A-Za-z]{10,48}'''
tags = ["slack", "token"]

[[rules]]
id = "google-api-key"
description = "Detect Google API keys"
regex = '''AIza[0-9A-Za-z\\-_]{35}'''
tags = ["google", "apikey"]

[[rules]]
id = "azure-connection-string"
description = "Detect Azure connection strings"
regex = '''DefaultEndpointsProtocol=https;AccountName=[a-z0-9]+;AccountKey=[A-Za-z0-9+/=]+;EndpointSuffix=core\.windows\.net'''
tags = ["azure", "connectionstring"]

[[rules]]
id = "generic-secret"
description = "Catch-all for 'secret=' assignments"
regex = '''(?i)(secret\s*=\s*["'][^"']+["'])'''
tags = ["secret", "generic"]
