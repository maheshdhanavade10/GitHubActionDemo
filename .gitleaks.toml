title = "Gitleaks Ruleset with Empty Structure Suppression"

[allowlist]
description = "Global allowlist to prevent false positives on empty placeholders"
regexes = [
    '''(?i)Password\s*=\s*["']?["']?;''',  # Matches Password=; or Password="";
    '''(?i)"Default"\s*:\s*""''',         # Matches "Default": ""
    '''(?i)"Password"\s*:\s*""'''         # Matches "Password": ""
]

# =========================
# Real Secret Detection
# =========================

[[rules]]
id = "connection-string-standard"
description = "Detect inline DB connection strings with credentials"
# Matches Password=... where the value is not empty
regex = '''(?i)Password\s*=\s*[^"';\s]+'''
keywords = ["password"]

[[rules]]
id = "json-default-connection"
description = "Detect populated 'Default' connection string in JSON"
# Matches "Default": "..." where the value is at least 1 character
regex = '''(?i)"Default"\s*:\s*"([^"\s]+)"'''
keywords = ["default"]

[[rules]]
id = "generic-password"
description = "Detect hardcoded passwords (min 6 chars)"
regex = '''(?i)password\s*=\s*["'][^"']{6,}["']'''
keywords = ["password"]

[[rules]]
id = "aws-access-key"
description = "Detect AWS Access Key IDs"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["aws", "key"]

[[rules]]
id = "aws-secret-key"
description = "Detect AWS Secret Access Keys"
regex = '''(?i)aws(.{0,20})?(secret|access)?.{0,20}?['"][0-9a-zA-Z/+]{40}['"]'''
tags = ["aws", "secret"]

[[rules]]
id = "jwt-token"
description = "Detect JWT tokens"
regex = '''eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.([A-Za-z0-9_-]+)'''
tags = ["jwt"]

[[rules]]
id = "private-key"
description = "Detect private key blocks"
regex = '''-----BEGIN( RSA)? PRIVATE KEY-----'''
tags = ["privatekey"]

[[rules]]
id = "github-token"
description = "Detect GitHub tokens"
regex = '''ghp_[0-9A-Za-z]{36}'''
tags = ["github"]

[extend]
useDefault = true
