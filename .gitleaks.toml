title = "C# Web API Gitleaks Config"
description = "Secret scanning rules for ASP.NET Core / C# projects"

[allowlist]
description = "Global allowlist"
regexes = [
  '''(?i)dummy|example|test|sample''', # ignore test/dummy secrets
]

[[rules]]
id = "azure-storage-key"
description = "Azure Storage Account Key"
regex = '''(?i)(DefaultEndpointsProtocol|AccountName|AccountKey|BlobEndpoint|QueueEndpoint|TableEndpoint)'''
tags = ["azure", "storage", "key"]

[[rules]]
id = "connection-string"
description = "SQL/NoSQL Connection Strings"
regex = '''(?i)(Server=[^;]+;(?:Database=[^;]+;)?User Id=[^;]+;Password=[^;]+;)'''
tags = ["sql", "connection", "database"]

[[rules]]
id = "jwt-token"
description = "JWT Token"
regex = '''eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.([A-Za-z0-9_-]+)'''
tags = ["jwt", "token"]

[[rules]]
id = "api-key"
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|apikey|secret|token)[\s:=]+[A-Za-z0-9_\-]{16,}'''
tags = ["api", "key"]

[[rules]]
id = "github-token"
description = "GitHub Personal Access Token"
regex = '''ghp_[A-Za-z0-9]{36}'''
tags = ["github", "token"]

[[rules]]
id = "azure-client-secret"
description = "Azure AD Client Secret"
regex = '''(?i)(client_secret)[\s:=]+[A-Za-z0-9_\-]{32,}'''
tags = ["azure", "ad", "secret"]

[[rules]]
id = "private-key"
description = "Private Key"
regex = '''-----BEGIN( RSA)? PRIVATE KEY-----'''
tags = ["key", "private"]
